name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# Runs are serialized; a running deploy is never cancelled. GitHub keeps only the
# newest pending run, so the latest commit on main always ends up deployed.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: |
          APP=$(sed -n "s/^app *= *['\"]\(.*\)['\"]/\1/p" fly.toml | head -1)
          for path in /healthz /; do
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "https://$APP.fly.dev$path" || true)
              [ "$code" = 200 ] && ok=1 && break
              sleep 5
            done
            [ $ok = 1 ] || { echo "smoke FAILED: $path -> $code"; exit 1; }
            echo "smoke ok: $path"
          done
