name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:
# Newer pushes to the same PR/branch cancel the older run (main is never cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Specs in the fast, required gate. Everything else in tests/ runs in the sharded "slow" job.
  FAST_SPECS: 'smoke slice cards'
jobs:
  fast:
    # Required PR gate (~5 min). Docker build is intentionally NOT here: deploy builds the image.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:determinism
      - run: npm run build
      - id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      - run: npx playwright test $FAST_SPECS
        env: { CI: '1' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-fast, path: test-results, retention-days: 14 }

  slow:
    # Non-required: main pushes, nightly, manual. Sharded; each shard keeps workers=1 (software GL).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      - name: Run slow specs (shard ${{ matrix.shard }}/4)
        env: { CI: '1' }
        run: |
          SLOW=$(for f in tests/*.spec.ts; do b=$(basename "$f" .spec.ts); case " $FAST_SPECS " in *" $b "*) ;; *) echo "$f";; esac; done)
          npx playwright test --shard=${{ matrix.shard }}/4 $SLOW
      - name: Summarize perf/playthrough
        if: always()
        run: |
          echo '### Perf / playthrough (shard ${{ matrix.shard }})' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-results/*/perf.json test-results/*/playthrough.json 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-slow-${{ matrix.shard }}
          path: test-results
          retention-days: 14

  report:
    # Keeps ONE open issue "Slow CI failing on main" (created or commented on, never duplicated).
    needs: slow
    if: ${{ always() && needs.slow.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the issue
        run: |
          TITLE='Slow CI failing on main'
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Slow-spec shards failed (event: ${{ github.event_name }}, commit ${GITHUB_SHA::7}).\n\nRun: $RUN\n\nSee the per-shard artifacts (playwright-slow-N) for traces/videos."
          N=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title -q "[.[]|select(.title==\"$TITLE\")][0].number")
          if [ -n "$N" ] && [ "$N" != null ]; then
            gh issue comment "$N" --body "$(printf "$BODY")"
          else
            gh issue create --title "$TITLE" --label sev2-major --label area:web --body "$(printf "$BODY")"
          fi
